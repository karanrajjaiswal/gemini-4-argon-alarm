name: Build Standalone Brahma Alarmy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (No Cache)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 Directly & Build Standalone APK
        run: |
          # 1. If the .zip file was uploaded directly to the repo, extract it automatically
          if [ -z "$(find . -name 'settings.gradle.kts' | head -n 1)" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting uploaded archive: $ZIP_FILE"
              unzip -o "$ZIP_FILE"
            fi
          fi

          # 2. Locate the Android project directory
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in repository! Contents of repo:"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. Auto-fix the unescaped quote on line 280 of RingActivity.kt from the v1 zip
          RING_FILE=$(find . -name "RingActivity.kt" | head -n 1)
          if [ -n "$RING_FILE" ]; then
            sed -i 's/""\$targetPhrase""/"\$targetPhrase"/g' "$RING_FILE"
          fi

          # 4. Write Android SDK license hashes directly so Gradle can install SDK 34
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          # 5. Download Gradle 8.7 directly (bypasses GitHub Cache Service)
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q -o gradle.zip

          # 6. Build Debug and Release APKs (skipping Lint checks that block ExactAlarm permissions)
          ./gradle-8.7/bin/gradle assembleDebug assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: Upload Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Alarmy-Standalone-APK
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/apk/release/app-release.apk
