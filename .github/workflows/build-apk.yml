name: Build Standalone Brahma Alarmy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (No Cache)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 Directly & Build Standalone APK
        run: |
          # 1. Automatically find the directory containing settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in repository! Make sure you uploaded the app folder and gradle files."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Accept Android SDK licenses automatically
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

          # 3. Download Gradle 8.7 directly (bypasses GitHub's broken Cache Service)
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip

          # 4. Compile Debug and Release Standalone APKs
          ./gradle-8.7/bin/gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Alarmy-Standalone-APK
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/apk/release/app-release.apk
